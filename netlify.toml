# Static site + serverless functions. No build step — the frontend is plain
# HTML/JS served from ./public; the Last.fm proxy lives in ./netlify/functions.
[build]
  publish = "public"
  functions = "netlify/functions"

# Clean API routes: /api/similar -> the "similar" function, etc.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Let the CDN cache function responses (also protects the Last.fm rate budget).
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "public, max-age=300"
